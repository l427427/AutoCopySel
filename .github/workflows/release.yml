name: Build & Release

# 打 tag（v1.1.3 这种）就自动构建两平台产物并挂到 Release。
# 也可以在 Actions 页面手动触发（只产出 artifact，不发 Release）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- macOS (Apple Silicon) ----------------
  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 环境信息（自证 runner 架构）
        run: |
          uname -m
          sw_vers
          python -V

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包 .app（复用 build_macos.sh，保证和本地同一套逻辑）
        env:
          PYTHON: python
          AUTOCOPYSEL_HOME: ${{ runner.temp }}/acs_home
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: 校验产物架构与签名
        run: |
          APP=dist/AutoCopySel.app
          file "$APP/Contents/MacOS/AutoCopySel"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"
          codesign --verify --strict "$APP" && echo "签名有效"

      - name: 版本号对齐 tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP=dist/AutoCopySel.app
          V="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$APP/Contents/Info.plist"
          # 改了 Info.plist 就得重签，否则签名失效（会改变 cdhash，用户需重新授权）
          codesign --force --deep --sign - "$APP"
          codesign --verify --strict "$APP" && echo "重签有效 / v$V"

      - name: 写使用说明并打包 zip
        run: |
          cat > 使用说明.txt <<'TXT'
AutoCopySel —— 鼠标划词自动复制

【安装】
1. 把 AutoCopySel.app 拖到「应用程序」文件夹
2. 首次打开：在「应用程序」里右键点它 → 打开 → 再点「打开」
   （如果你是从浏览器下载的，macOS 会拦一次，这是正常的：
     没有 Apple 开发者签名的免费应用都会被拦。）
3. 系统设置 → 隐私与安全性 → 辅助功能 → 勾选 AutoCopySel
4. 不需要重启，勾上后 2 秒内自动生效

【验证是否可用】
打开任意软件，用鼠标选中一段文字，然后 Cmd+V 粘贴试试。

【如果勾了却没反应】
点菜单栏图标 → 「修复权限（重置授权记录）」→ 重新勾选。
原因：本项目是 ad-hoc 签名，macOS 记录授权靠二进制哈希，
换一个版本的程序就会失配，必须重置一次。

详细说明见仓库 README。
TXT
          # ditto 能保留 .app 的符号链接与代码签名，是分发 macOS 应用的标准做法
          ditto -c -k --sequesterRsrc --keepParent dist/AutoCopySel.app "AutoCopySel-macos-arm64/AutoCopySel.app"
          cp 使用说明.txt "AutoCopySel-macos-arm64/使用说明.txt"
          ditto -c -k --sequesterRsrc --keepParent "AutoCopySel-macos-arm64" AutoCopySel-macos-arm64.zip
          ls -lh AutoCopySel-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AutoCopySel-macos-arm64
          path: AutoCopySel-macos-arm64.zip
          if-no-files-found: error

  # ---------------- Windows x64 ----------------
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name AutoCopySel `
            --hidden-import pystray._win32 `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --hidden-import autocopysel.health `
            --hidden-import autocopysel.diagnostics `
            --collect-submodules pystray `
            run.py

      - name: 组装 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path AutoCopySel-windows-x64 | Out-Null
          Copy-Item dist\AutoCopySel.exe AutoCopySel-windows-x64\
          @"
AutoCopySel —— 鼠标划词自动复制

【使用】
解压后双击 AutoCopySel.exe 即可，托盘区会出现图标。

【首次运行被拦】
Windows 会提示"Windows 已保护你的电脑"，点「更多信息」→「仍要运行」。
这是因为没有代码签名证书，不是病毒。

【验证是否可用】
打开任意软件，用鼠标选中一段文字，然后 Ctrl+V 粘贴试试。

【如果选中没反应】
右键托盘图标 →「运行诊断」，会告诉你哪一步没通。

详细说明见仓库 README。
"@ | Set-Content -Path AutoCopySel-windows-x64\使用说明.txt -Encoding UTF8
          Compress-Archive -Path AutoCopySel-windows-x64\* -DestinationPath AutoCopySel-windows-x64.zip -Force
          Get-Item AutoCopySel-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AutoCopySel-windows-x64
          path: AutoCopySel-windows-x64.zip
          if-no-files-found: error

  # ---------------- 发布 ----------------
  release:
    name: Publish Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理附件
        run: |
          find artifacts -type f | sort
          mkdir -p out
          cp artifacts/AutoCopySel-macos-arm64/AutoCopySel-macos-arm64.zip out/
          cp artifacts/AutoCopySel-windows-x64/AutoCopySel-windows-x64.zip out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | macOS (Apple Silicon / M 系列) | `AutoCopySel-macos-arm64.zip` | 解压后拖进「应用程序」，首次**右键 → 打开** |
            | Windows 10/11 x64 | `AutoCopySel-windows-x64.zip` | 解压后双击 `AutoCopySel.exe` |

            ## 首次使用必读

            **macOS**：装好之后必须去 **系统设置 → 隐私与安全性 → 辅助功能** 勾选 AutoCopySel。
            不授权的话鼠标事件收不到，选中文本不会有任何反应。勾上后 2 秒内自动生效，不用重启。

            **Windows**：无需授权。首次运行可能被 SmartScreen 拦，点「更多信息 → 仍要运行」。

            ## 为什么没签名

            Apple 开发者签名（$99/年）和 Windows 代码签名证书都没有，所以两个平台都会拦一次。
            介意的话可以自己从源码打包：仓库里 `build_macos.sh` / `build_windows.bat` 各一条命令。

            ## Intel Mac

            本 Release 只提供 arm64（M 系列）版本。Intel Mac 请从源码自行打包。
